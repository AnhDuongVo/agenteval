[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.1.0"
description = "Framework-agnostic evaluation for LLM agents: one schema, adapters for LangGraph, LlamaIndex and OpenAI tool-calling, and behavioral metrics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Anh Duong Vo" }]
keywords = ["llm", "agents", "evaluation", "langgraph", "llamaindex", "openai", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.6", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10"]

[project.scripts]
agenteval = "agenteval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
